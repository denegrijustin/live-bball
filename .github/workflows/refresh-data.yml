name: Refresh data

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch results and re-solve ratings
        run: npm run data
      - name: Run unit tests
        run: npm test
      - name: Verify the app still builds with the new data
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet -- data src/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data src/data/generated
          git commit -m "chore(data): refresh results and ratings"
          git push
